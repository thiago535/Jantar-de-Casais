<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <title>Admin - Lista</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.35.0/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 0;
      background: linear-gradient(135deg, #090909, #1f111f);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .card {
      background: #222;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 14px;
    }

    #login {
      max-width: 380px;
      margin: 8vh auto;
      text-align: center;
      padding: 28px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    #login h2 {
      margin-bottom: 24px;
      font-size: 24px;
      letter-spacing: 0.02em;
    }

    .input-row {
      position: relative;
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 15px;
      box-sizing: border-box;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    input::placeholder {
      color: #d3d3d3;
      opacity: 0.8;
    }

    .eye-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #d3d3d3;
      padding: 8px;
      border-radius: 999px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .eye-icon:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    button {
      margin-top: 18px;
      padding: 14px 18px;
      width: 100%;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff4d6d, #ff6a82);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(255, 77, 109, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 77, 109, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #erro {
      margin-top: 16px;
      color: #ff8aa2;
      min-height: 20px;
      font-size: 14px;
    }

    #painel {
      max-width: 760px;
      margin: 24px auto;
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 20px;
      }

      #login {
        max-width: 100%;
        margin: 20px auto;
        padding: 24px 20px;
        border-radius: 20px;
      }

      #login h2 {
        font-size: 22px;
        margin-bottom: 20px;
      }

      .input-row {
        margin-top: 14px;
      }

      input {
        padding: 14px 16px;
        font-size: 16px;
      }

      .eye-icon {
        font-size: 16px;
        right: 14px;
      }

      button {
        padding: 15px 18px;
        font-size: 16px;
        margin-top: 20px;
      }

      #erro {
        font-size: 14px;
        margin-top: 14px;
      }

      #painel {
        margin: 20px 0;
        padding: 0 16px;
      }

      .card {
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 12px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        padding-top: 16px;
      }

      #login {
        padding: 20px 16px;
        margin: 16px auto;
      }

      #login h2 {
        font-size: 20px;
        margin-bottom: 16px;
      }

      input {
        padding: 12px 14px;
        font-size: 15px;
      }

      .eye-icon {
        font-size: 15px;
        right: 12px;
      }

      button {
        padding: 14px 16px;
        font-size: 15px;
        margin-top: 18px;
      }

      #painel {
        padding: 0 12px;
      }

      .card {
        padding: 12px;
        margin-bottom: 10px;
      }
    }
  </style>

</head>

<body>

  <div id="login">
    <h2>🔒 Área restrita</h2>
    <div class="input-row">
      <input type="password" id="senha" placeholder="Digite a senha">
      <span class="eye-icon" onclick="toggleSenha(this)" title="Mostrar senha">👁️</span>
    </div>
    <button type="button" onclick="entrar()">Entrar</button>
    <p id="erro"></p>
  </div>

  <div id="painel" style="display:none;">
    <h2>📋 Lista de Casais</h2>
    <div id="lista"></div>
  </div>

  <script>

    // 🔐 MUDE AQUI SUA SENHA
    const SENHA_CORRETA = "mile2026@"; // <-- troca isso

    const supabase = window.supabase.createClient(
      "https://qfoiyphfyjjzxgesynmt.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmb2l5cGhmeWpqenhnZXN5bm10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDY1ODEsImV4cCI6MjA5MzQyMjU4MX0.--ZELH0chJiXeC6mHRxwhtIvkPm8cxNQZEnk6IRzjSs"
    );

    function entrar() {
      let senha = document.getElementById("senha").value;
      document.getElementById("erro").innerText = "";

      if (senha === SENHA_CORRETA) {
        document.getElementById("login").style.display = "none";
        document.getElementById("painel").style.display = "block";
        carregar();
      } else {
        document.getElementById("erro").innerText = "Senha incorreta!";
      }
    }

    function toggleSenha(botao) {
      const senhaInput = document.getElementById("senha");
      if (senhaInput.type === "password") {
        senhaInput.type = "text";
        botao.innerText = "Ocultar senha";
      } else {
        senhaInput.type = "password";
        botao.innerText = "Mostrar senha";
      }
    }

    async function carregar() {
      try {
        const { data, error } = await supabase
          .from("inscricoes")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          document.getElementById("erro").innerText = "Erro ao carregar lista: " + error.message;
          return;
        }

        if (!data || data.length === 0) {
          document.getElementById("lista").innerHTML = "<p>Nenhum registro encontrado.</p>";
          return;
        }

        let html = "";

        data.forEach(item => {
          html += `
      <div class="card">
        <strong>${item.nome}</strong><br>
        📞 ${item.telefone}<br>
        👶 Filhos: ${item.filhos}<br>
        🎂 Idades: ${item.idades}<br>
        💳 Pagamento: ${item.pagamento || 'Não informado'}
      </div>
    `;
        });

        document.getElementById("lista").innerHTML = html;
      } catch (err) {
        document.getElementById("erro").innerText = "Erro ao carregar lista: " + (err.message || err);
      }
    }

  </script>

</body>

</html>
